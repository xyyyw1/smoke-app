name: Build 烟感预警 App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Chocolatey（如需）
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))

      - name: 安装 WiX Toolset v3.14
        run: choco install wixtoolset -y --version=3.14.0

      - name: 将 WiX 加入 PATH
        run: echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: 全局安装 pake-cli
        run: npm install -g pake-cli

      - name: 构建应用
        run: |
          pake https://easterproject.pages.dev/ --name 烟感预警 --icon ./favicon.ico --targets windows

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: 烟感预警-windows
          path: 烟感预警*.msi
