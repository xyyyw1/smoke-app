name: Build 烟感预警 App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 步骤1：将已安装的 WiX 加入 PATH
      - name: 设置 WiX 环境变量
        run: |
          $wixDir = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (Test-Path $wixDir) {
            echo "WIX=$wixDir" | Out-File -FilePath $env:GITHUB_ENV -Append
            echo $wixDir | Out-File -FilePath $env:GITHUB_PATH -Append
          } else {
            $wixDir = "C:\Program Files (x86)\WiX Toolset v3.11\bin"  # 备用
            if (Test-Path $wixDir) {
              echo "WIX=$wixDir" | Out-File -FilePath $env:GITHUB_ENV -Append
              echo $wixDir | Out-File -FilePath $env:GITHUB_PATH -Append
            }
          }
        shell: pwsh

      # 步骤2：验证 light.exe 可执行（可选，但可帮助调试）
      - name: 检查 light.exe 是否可用
        run: where light.exe
        shell: cmd

      # 步骤3：安装 Visual C++ Redistributable（light.exe 依赖）
      - name: 安装 VC++ Redistributable
        run: choco install vcredist-all -y --limit-output
        continue-on-error: true  # 如果已安装则跳过错误

      # 步骤4：全局安装 pake-cli
      - name: 安装 pake-cli
        run: npm install -g pake-cli

      # 步骤5：构建应用
      - name: 构建应用
        run: |
          pake https://easterproject.pages.dev/ --name 烟感预警 --icon ./favicon.ico --targets windows

      # 步骤6：上传产物
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: 烟感预警-windows
          path: 烟感预警*.msi
